html,body{margin:0;background:#0b0c0e;}

#phone b{font-weight:600;color:var(--ink);}
#hint{position:fixed;left:16px;bottom:12px;color:#9aa0a8;font:14px/1.4 system-ui,sans-serif;}
.render #hint{display:none;}

const piece = (f, segs, a0, ease) => { // trechos encadeados [{from,to,a,z}]

};

// ---------------------------------------------------------------- seek(f): o quadro inteiro como função de f
function seek(fRaw) {
  const f = clamp(fRaw, 0, TOTAL - 0.001);
  const F = fd(f);

  // ---- câmera do mundo
  let s = 1, P = [0, 0], Q = [0, 0];
  if (f < CUE.pull) {
    const zIn = tw(f, 0, 236, 1, 1.07, E.dolly), zOut = tw(f, 252, 336, 1, 1 / 1.07, E.cam);
    const zDock = tw(f, CUE.door, CUE.step2 + 40, 1, 1.06, E.dolly) * tw(f, DRIVE[1].from - 10, DRIVE[1].from + 40, 1, 1 / 1.06, E.cam);
    s = BASE * zIn * zOut * zDock; const cx = camX(f);
    P = [980 + cx, G.ground]; Q = [960, GY];
  } else {
    const p = prog(f, CUE.pull - 1, CUE.pull - 1 + DUR.pull, E.cam);
    // o caminhão e o contêiner encolhem até virar o ponto de Santos no mapa
    s = lmix(BASE, 0.03, p); P = [G.depotX + G.cw / 2, G.rows[2] + G.ch / 2];
    const q0 = [960, GY + (G.rows[2] + G.ch / 2 - G.ground) * BASE];
    Q = [mix(q0[0], S0[0], p), mix(q0[1], S0[1], p)];
  }
  $('world').setAttribute('transform', `translate(${Q[0]} ${Q[1]}) scale(${s}) translate(${-P[0]} ${-P[1]})`);
  $('world').style.display = f < CUE.grid + 1 ? '' : 'none';
  rest.setAttribute('opacity', 1 - prog(f, CUE.pull + 8, CUE.pull + 44, E.smooth));
  $('worldTop').setAttribute('opacity', 1 - prog(f, CUE.pull + 8, CUE.pull + 30, E.smooth));

  // ---- pilha do terminal
  for (const k of stack) {
    let x = G.stackCols[k.c], y = G.rows[k.r];
    const li = leavers.indexOf(k);
    if (li > -1) y -= tw(f, CUE.leave[li], CUE.leave[li] + DUR.leave, 0, y - 200 + G.ch + 60, EXIT);
    k.g.setAttribute('transform', tf(x, y));
  }
  arm.setAttribute('transform', `rotate(${tw(f, CUE.barrier - 1, CUE.barrier - 1 + DUR.barrier, 0, 82, E.out)} ${G.gateX + 10} ${G.ground - 141})`);

  // ---- caminhão
  const tx = truckX(f);
  truck.setAttribute('transform', `translate(${tx.toFixed(3)} 0)`);
  for (const w of wheels) w.g.setAttribute('transform', `translate(${w.x} ${w.y}) rotate(${((tx / G.wheel) * 180 / Math.PI).toFixed(3)})`);

  // ---- nosso contêiner no mundo
  let ox = 720, oy = G.rows[1];
  if (f >= CUE.liftFrom) oy = tw(f, CUE.liftFrom, CUE.liftFrom + DUR.lift, G.rows[1], 330, E.inOut);
  if (f >= CUE.seat - DUR.lower) oy = tw(f, CUE.seat - DUR.lower, CUE.seat, 330, G.onDeck, E.contact);
  if (f >= CUE.seat) ox = tx;
  if (f >= CUE.lift2From) {
    oy = tw(f, CUE.lift2From, CUE.lift2From + 25, G.onDeck, 396, E.inOut);
    if (f >= CUE.stack2 - 20) oy = tw(f, CUE.stack2 - 20, CUE.stack2, 396, G.rows[2], E.contact);
    ox = G.depotX;
  }
  const sq1 = hitPulse(f - CUE.seat, 1, 4), sq2 = hitPulse(f - CUE.stack2, 1, 4);
  const sy = 1 - 0.035 * (sq1 + sq2), sxx = 1 + 0.02 * (sq1 + sq2);
  ours.g.setAttribute('transform', `translate(${(ox - (sxx - 1) * G.cw / 2).toFixed(3)} ${(oy + (1 - sy) * G.ch).toFixed(3)}) scale(${sxx.toFixed(4)} ${sy.toFixed(4)})`);
  // carga: três paletes saem pela porta traseira, a carga diminui um terço por palete
  let gone = 0;
  pals.forEach((p, i) => {
    const a = CUE.drainFrom + i * 20, q = prog(f, a, a + 36, E.smooth);
    p.setAttribute('transform', tf(mix(3730, DX0 - 40, q), G.deck - 84));
    gone += prog(f, a, a + 16, E.ui) / 3;
  });
  ours.setFill(1 - gone);
  shutter.setAttribute('transform', `translate(0 ${-tw(f, CUE.door - 1, CUE.door - 1 + DUR.door, 0, DY1 - DY0 - 8, E.out)})`);
  // etiqueta de dias
  const day = CUE.day.reduce((n, c) => (F >= c ? n + 1 : n), 0);
  const tagIn = prog(f, CUE.day[0] - 1, CUE.day[0] + 11, E.out) * (1 - prog(f, CUE.liftFrom - 6, CUE.liftFrom + 6, E.smooth));
  const pulse = CUE.day.reduce((m, c) => Math.max(m, hitPulse(f - c, 2, 5)), 0);
  ours.tag.setAttribute('opacity', tagIn.toFixed(3));
  ours.tag.setAttribute('transform', `translate(142 82) scale(${(0.9 + 0.1 * tagIn + 0.1 * pulse).toFixed(4)}) translate(-142 -82)`);
  ours.tagT.textContent = 'DIA ' + Math.max(1, day);

  // ---- spreaders
  const sp1y = f < CUE.grab ? tw(f, CUE.grab - DUR.spreaderIn, CUE.grab, -260, G.rows[1], E.contact)
    : f < CUE.release ? oy : tw(f, CUE.release, CUE.release + DUR.release, G.onDeck, -320, E.in);
  spr1.setAttribute('transform', tf(720, sp1y));
  spr1.style.display = f < CUE.release + DUR.release ? '' : 'none';
  const sp2y = f < CUE.grab2 ? tw(f, CUE.grab2 - DUR.spreaderIn, CUE.grab2, -260, G.onDeck, E.contact)
    : f < CUE.stack2 + 6 ? oy : tw(f, CUE.stack2 + 6, CUE.stack2 + 36, G.rows[2], -320, E.in);
  spr2.setAttribute('transform', tf(G.depotX, sp2y));
  spr2.style.display = f > CUE.grab2 - DUR.spreaderIn - 2 && f < CUE.stack2 + 36 ? '' : 'none';

  // ---- trilho dos passos
  const railIn = prog(f, FILM.COPY[3].in, FILM.COPY[3].in + 20, E.out) * (1 - prog(f, CUE.pull - 2, CUE.pull + 14, E.smooth));
  rail.setAttribute('opacity', railIn.toFixed(3));
  [CUE.step1, CUE.step2, CUE.step3].forEach((c, i) => {
    const p = prog(f, c - 6, c + 4, E.out), pu = hitPulse(f - c, 2, 6);
    nodes[i].dot.setAttribute('r', (13 * p).toFixed(3));
    nodes[i].g.setAttribute('transform', `translate(${nodes[i].x} 942) scale(${(1 + 0.25 * pu).toFixed(4)})`);
  });

  // ---- mapa de cobertura
  mapG.style.display = f >= CUE.pull + 4 && f < CUE.hero ? '' : 'none';
  const mk = tw(f, CUE.grid - 20, CUE.implode, 1, 1.05, E.dolly);
  const mOut = prog(f, CUE.implode + 6, CUE.implode + 38, E.smooth);
  mapG.setAttribute('transform', `translate(${S0[0]} ${S0[1]}) scale(${mk.toFixed(5)}) translate(${-S0[0]} ${-S0[1]})`);
  mapG.setAttribute('opacity', (prog(f, CUE.pull + 6, CUE.pull + 40, E.smooth) * (1 - mOut)).toFixed(3));
  routes.forEach((rt, i) => {
    const a = FILM.ROUTE.start + i * FILM.ROUTE.step, p = prog(f, a, a + FILM.ROUTE.dur, E.out);
    rt.el.setAttribute('stroke-dashoffset', (1 - p).toFixed(4));
    const pd = prog(f, a + FILM.ROUTE.dur - 8, a + FILM.ROUTE.dur + 4, E.out);
    rt.dot.setAttribute('r', (7 * pd + 2.5 * hitPulse(f - (a + FILM.ROUTE.dur - 4), 2, 5)).toFixed(3));
  });
  const sp = prog(f, CUE.pull + 46, CUE.pull + 60, E.out);
  santos.setAttribute('opacity', (sp * (1 - mOut)).toFixed(3));
  const ring = ((f - CUE.grid) % 40 + 40) % 40 / 40;
  santosRing.setAttribute('r', (12 + 26 * E.out(ring)).toFixed(2));
  santosRing.setAttribute('opacity', (f >= CUE.grid ? 0.6 * (1 - ring) : 0).toFixed(3));

  // ---- nosso contêiner na tela (de Santos até o logo)
  $('sOurs').style.display = f >= CUE.implode ? '' : 'none';
  let sx = 0, syy = 0, ss = 0.03, so = 1;
  { const p = prog(f, CUE.implode, CUE.implode + DUR.hero, E.inOut); ss = lmix(0.03, 1.6, p);
    const cx = mix(S0[0], 960, p), cy = mix(S0[1], 531, p); sx = cx - G.cw * ss / 2; syy = cy - G.ch * ss / 2; }
  if (f >= CUE.implode + DUR.hero) { const p = prog(f, CUE.implode + DUR.hero, CUE.refill, E.dolly); const k = mix(1.6, 1.78, p); sx = 960 - G.cw * k / 2; syy = 531 - G.ch * k / 2; ss = k; }
  if (f >= CUE.refill) { const p = prog(f, CUE.refill, CUE.refill + 40, E.inOut); ss = lmix(1.78, 0.42, p); sx = mix(960 - G.cw * 1.78 / 2, 700, p); syy = mix(531 - G.ch * 1.78 / 2, 664 - G.ch * 0.42, p); }
  if (f >= CUE.refill + 40) { sx = 700 + tw(f, CUE.refill + 40, CUE.lock, 0, 150, E.linear); }
  if (f >= CUE.lock) {
    const p = prog(f, CUE.lock, CUE.lock + DUR.lock, E.inOut), w0 = G.cw * 0.42;
    const cx0 = 850 + w0 / 2, cy0 = 664 - G.ch * 0.42 / 2;
    const k = lmix(0.42, 0.14, p), cx = mix(cx0, LK.tail.x, p), cy = mix(cy0, LK.tail.y, p);
    const q = prog(f, CUE.lock + 30, CUE.lock + 46, E.in);
    ss = k * (1 - 0.9 * q); sx = cx - G.cw * ss / 2; syy = cy - G.ch * ss / 2; so = 1 - q;
  }
  sOurs.g.setAttribute('transform', tf(sx, syy, ss));
  sOurs.g.setAttribute('opacity', so.toFixed(3));

  // contador 1974 → 2026 em estêncil na lateral

  sOurs.yearG.setAttribute('transform', `translate(${G.cw / 2 + 70} ${G.ch / 2}) scale(${(1 + 0.06 * hitPulse(f - FILM.yearLock(), 2, 6)).toFixed(4)}) translate(${-G.cw / 2 - 70} ${-G.ch / 2})`);

  // ---- linha da promessa

  // ---- marca
  const ms = LK.ms * tw(f, CUE.settle - 20, TOTAL, 1, 1.08, E.dolly);
  const cxL = 960, cyL = LK.my + 145;
  markG.setAttribute('transform', `translate(${cxL} ${cyL}) scale(${(ms / LK.ms).toFixed(5)}) translate(${-cxL} ${-cyL}) ${tf(LK.mx, LK.my, LK.ms)}`);
  redPath.setAttribute('stroke-dashoffset', (1 - prog(f, CUE.redArrow, CUE.redArrow + DUR.arrow, E.out)).toFixed(4));
  grayPath.setAttribute('stroke-dashoffset', (1 - prog(f, CUE.grayArrow, CUE.grayArrow + DUR.arrow, E.out)).toFixed(4));

  $('word').style.transform = `translate(${ox2.toFixed(2)}px, ${oy2.toFixed(2)}px) scale(${creep.toFixed(5)})`;
  $('word').style.transformOrigin = '0 0';
  wordI.forEach((i, k) => { const a = CUE.word + k * 4, p = arrive(prog(f, a, a + DUR.word, E.out)); i.style.transform = `translateY(${(112 * (1 - p)).toFixed(2)}%)`; });
  const pp = prog(f, CUE.phone, CUE.phone + 24, E.out);
  phone.style.opacity = pp.toFixed(3);
  phone.style.transform = `translate(${((LK.wx - 960) * (creep - 1)).toFixed(2)}px, ${((LK.wy + LK.phoneDy - cyL) * (creep - 1) + 16 * (1 - pp)).toFixed(2)}px) scale(${creep.toFixed(5)})`;
  phone.style.transformOrigin = '0 0';

  // ---- títulos
  for (const h of heads) {
    const { c, words } = h;
    const vis = f >= c.in - 1 && f < c.out + 30;
    h.d.style.display = vis ? '' : 'none';
    if (!vis) continue;
    words.forEach((w, k) => {
      const a = c.in + k * 3, p = arrive(prog(f, a, a + DUR.wordIn, E.out));
      const o = c.out + k * 2, q = depart(prog(f, o, o + DUR.wordOut, E.in));
      w.style.transform = `translateY(${(112 * (1 - p) - 112 * q).toFixed(2)}%)`;
    });
  }
}

// ---------------------------------------------------------------- carga, player
let scaleNow = 1;
function fit() {
  if (RENDER) return;
  scaleNow = Math.min(innerWidth / 1920, innerHeight / 1080);
  const st = $('stage');
  st.style.transform = `scale(${scaleNow})`;
  st.style.position = 'absolute';
  st.style.left = (innerWidth - 1920 * scaleNow) / 2 + 'px';
  st.style.top = (innerHeight - 1080 * scaleNow) / 2 + 'px';
}
window.seek = seek;
window.FILM_READY = (async () => {
  // as setas vêm de assets/mark.js (vetorização do logo do site)
  el('path', { d: MARK.gray, fill: C.gray }, grayArrow);
  el('path', { d: MARK.red, fill: C.red }, redArrow);
  await Promise.all([
    document.fonts.load('900 112px "Big Shoulders"'), document.fonts.load('800 46px "Big Shoulders"'),
    document.fonts.load('500 40px "IBM Plex Sans"'), document.fonts.load('600 26px "IBM Plex Mono"'),
  ]);
  await document.fonts.ready;
  fit(); layoutLockup(); seek(0);
})();
if (!RENDER) {
  addEventListener('resize', () => { fit(); });
  const audio = new Audio('out/soundtrack.wav'); let hasAudio = false;
  audio.addEventListener('canplaythrough', () => { hasAudio = true; }, { once: true });
  let playing = false, t0 = 0, f0 = 0, cur = 0;
  const toggle = () => {
    playing = !playing;
    if (playing) { if (cur >= TOTAL - 1) cur = 0; t0 = performance.now(); f0 = cur; if (hasAudio) { audio.currentTime = cur / 60; audio.play(); } }
    else audio.pause();
  };
  const jump = (f) => { cur = clamp(f, 0, TOTAL - 1); seek(cur); if (playing) { t0 = performance.now(); f0 = cur; if (hasAudio) audio.currentTime = cur / 60; } };
  addEventListener('click', toggle);
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.key === 'ArrowRight') jump(cur + 60); if (e.key === 'ArrowLeft') jump(cur - 60); if (e.key === '0') jump(0);
  });
  const loop = () => {
    if (playing) {
      cur = hasAudio && !audio.paused ? audio.currentTime * 60 : f0 + ((performance.now() - t0) / 1000) * 60;
      if (cur >= TOTAL) { cur = TOTAL - 1; playing = false; audio.pause(); }
      seek(cur);
    }
    requestAnimationFrame(loop);
  };
  FILM_READY.then(() => { requestAnimationFrame(loop); });
}
</script>
